name: CI
on:
  pull_request: { branches: [main] }
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.4.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/db check-types
      - run: pnpm --filter @workspace/api check-types
      - run: pnpm --filter web check-types
      - run: pnpm --filter @workspace/api test:chat
      - run: pnpm --filter web build
      - run: docker build -f Dockerfile.api .
      - name: CRM PostgreSQL isolation (optional)
        if: ${{ secrets.CRM_TEST_DATABASE_URL != '' }}
        env: { CRM_TEST_DATABASE_URL: ${{ secrets.CRM_TEST_DATABASE_URL }} }
        run: pnpm --filter @workspace/db test:crm:integration
