
services:
  nginx:
    image: nginx:1.28-alpine
    container_name: cms-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deployment/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      cms-network:
        ipv4_address: 172.30.0.2

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: cms-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      NODE_ENV: production
      PORT: 3002
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TRUST_PROXY: 172.30.0.2
    expose:
      - "3002"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3002/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      cms-network:
        ipv4_address: 172.30.0.3

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: cms-worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cms-network

  redis:
    image: redis:7-alpine
    container_name: cms-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - cms-network

volumes:
  redis-data:

networks:
  cms-network:
    name: cms-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
